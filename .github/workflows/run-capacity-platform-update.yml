name: Run capacity platform update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run capacity platform update
        run: python3 scripts/update_capacity_platform.py

      - name: Remove temporary files
        run: |
          rm scripts/update_capacity_platform.py
          rm .github/workflows/run-capacity-platform-update.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience.html scripts/update_capacity_platform.py .github/workflows/run-capacity-platform-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Feature capacity planning platform"
            git push
          fi
