name: Run operating structure refresh v2

on:
  push:
    paths:
      - 'scripts/operating_structure_refresh_v2.py'
      - '.github/workflows/run-operating-structure-refresh-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run operating structure refresh
        run: python scripts/operating_structure_refresh_v2.py

      - name: Remove temporary files
        if: always()
        run: |
          rm -f scripts/refresh_operating_structure_positioning.py
          rm -f scripts/operating_structure_refresh_v2.py
          rm -f .github/workflows/run-operating-structure-refresh.yml
          rm -f .github/workflows/run-operating-structure-refresh-v2.yml

      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Align portfolio to operating structure positioning" || echo "No changes to commit"
          git push
