name: Run collapse capacity case study

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Collapse capacity case study
        run: python3 scripts/collapse_capacity_case_study.py

      - name: Remove temporary files
        run: |
          rm scripts/collapse_capacity_case_study.py
          rm .github/workflows/run-collapse-capacity-case-study.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience.html scripts/collapse_capacity_case_study.py .github/workflows/run-collapse-capacity-case-study.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Collapse capacity planning into one case study"
            git push
          fi
