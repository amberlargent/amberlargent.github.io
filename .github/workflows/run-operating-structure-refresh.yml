name: Run operating structure refresh

on:
  push:
    paths:
      - 'scripts/refresh_operating_structure_positioning.py'
      - '.github/workflows/run-operating-structure-refresh.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run operating structure refresh
        run: python scripts/refresh_operating_structure_positioning.py

      - name: Remove temporary files
        run: |
          rm scripts/refresh_operating_structure_positioning.py
          rm .github/workflows/run-operating-structure-refresh.yml

      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Align portfolio to operating structure positioning" || echo "No changes to commit"
          git push
