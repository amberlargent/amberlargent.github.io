name: Patch homepage enablement cards

on:
  push:
    paths:
      - '.github/workflows/patch-homepage-enablement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage enablement card
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '''        <div class="card id-card">
          <h3>New Product Team readiness</h3>
          <p>
            Led cross-functional learning and readiness work across 3 organizations and 5 teams, delivering 6 instructor-led
            courses, 23 self-guided trainings, process documentation updates, and scalable support resources.
          </p>
          <div class="tag-list">
            <span class="tag">3 organizations</span>
            <span class="tag">5 teams</span>
            <span class="tag">ILT</span>
            <span class="tag">Self-guided training</span>
          </div>
        </div>'''
          new = '''        <div class="card id-card">
          <h3>New Product Team readiness</h3>
          <p>
            <strong>Challenge:</strong> Disclosed new product work required readiness support across multiple AC Training
            partners, including new processes, regulations, and ambiguous work.
          </p>
          <p>
            <strong>Action:</strong> Led cross-functional learning and readiness work across 3 organizations and 5 teams,
            authoring 6 instructor-led courses with online workbooks, developing 27 self-guided trainings, designing
            3 Chorus pages, updating process documentation, and creating scalable support resources.
          </p>
          <p>
            <strong>Result:</strong> Helped partners prepare for complex product-related work with clearer documentation,
            practical training support, and reusable readiness resources.
          </p>
          <div class="tag-list">
            <span class="tag">3 organizations</span>
            <span class="tag">5 teams</span>
            <span class="tag">6 ILTs</span>
            <span class="tag">27 SGTs</span>
            <span class="tag">3 Chorus pages</span>
            <span class="tag">Process docs</span>
          </div>
        </div>'''
          if old not in text:
              raise SystemExit('Target homepage card not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-homepage-enablement.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-homepage-enablement.yml
          git commit -m "Make homepage enablement cards uniform"
          git push
