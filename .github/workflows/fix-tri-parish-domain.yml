name: Fix Tri-Parish domain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-domain:
    if: contains(github.event.head_commit.message, 'Run Tri-Parish domain fix')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace incorrect Tri-Parish domain
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('triparish.html')]
          replacements = {
              'https://triparish.org/': 'https://triparishok.org/',
              'https://www.triparish.org/': 'https://www.triparishok.org/',
              'triparish.org': 'triparishok.org',
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-tri-parish-domain.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit domain fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html triparish.html .github/workflows/fix-tri-parish-domain.yml
            git commit -m "Fix Tri-Parish live site domain"
            git push
          fi
