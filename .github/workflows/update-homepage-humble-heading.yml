name: Update homepage humble heading

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage heading language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<div class="section-kicker">How I Create Clarity</div>',
              '<div class="section-kicker">How I Help</div>'
          )
          text = text.replace(
              '<h2>Equal strength across learning, process, AI, knowledge, and operations.</h2>',
              '<h2>Where learning, process, AI, knowledge, and operations meet.</h2>'
          )

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/update-homepage-humble-heading.yml')
          if workflow.exists():
              workflow.unlink()

          trigger = Path('.update-homepage-humble-heading-trigger')
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html .github/workflows/update-homepage-humble-heading.yml .update-homepage-humble-heading-trigger
            git commit -m "Soften homepage clarity heading"
            git push
          fi
