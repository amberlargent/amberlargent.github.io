name: Remove redundant section kickers

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remove redundant visual labels
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html_files = [
              Path('index.html'),
              Path('experience.html'),
              Path('learning.html'),
              Path('values.html'),
              Path('samples.html'),
              Path('triparish.html'),
          ]

          for path in html_files:
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Remove section-level all-caps kickers. These were functioning as duplicate labels
              # because the section headings and navigation already provide the structure.
              text = re.sub(r'\n\s*<div class="section-kicker">[^<]*</div>\n', '\n', text)

              # Remove only truly duplicate hero eyebrow lines. Keep meaningful hero context such as
              # Work Evidence • Coaching • Process • Visibility and Projects • Enablement • Technology Judgment.
              text = text.replace('        <div class="eyebrow">Learning + Credentials</div>\n', '')
              text = text.replace('        <div class="eyebrow">How I Work</div>\n', '')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/remove-redundant-kickers.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html experience.html learning.html values.html samples.html triparish.html .github/workflows/remove-redundant-kickers.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove redundant section kickers"
            git push
          fi
