name: Patch site navigation

on:
  push:
    paths:
      - '.github/workflows/patch-homepage-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation across pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          new_css = '''    .nav-links a {
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-links a[href^="#"] {
      color: var(--slate);
    }

    .nav-links a[href*=".html"] {
      color: var(--pink);
    }

    .nav-links a:hover {
      color: var(--pink);
    }
'''

          css_pattern = re.compile(r'''    \.nav-links a \{\n      text-decoration: none;\n      color: var\(--black\);\n      transition: color 0\.15s ease;\n    \}\n\n    \.nav-links a:hover(?:,\n    \.nav-links a:focus-visible)? \{\n      color: var\(--pink\);\n    \}\n''')

          homepage_nav = '''      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#where-i-create-value">How I Help</a>
        <a href="#work">Work</a>
        <a href="#proof">Evidence</a>
        <a href="values.html">How I Work</a>
        <a href="#contact">Contact</a>
      </div>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text()
              original = text
              text = css_pattern.sub(new_css, text)

              if path.name == 'index.html':
                  text = re.sub(
                      r'''      <div class="nav-links">\n(?:        <a href="[^"]+">[^<]+</a>\n)+      </div>''',
                      homepage_nav,
                      text,
                      count=1,
                  )

              if text != original:
                  path.write_text(text)
                  print(f'patched {path}')
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-homepage-nav.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify navigation link behavior across site"
          git push
