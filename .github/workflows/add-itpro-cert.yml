name: Add Apple IT Pro credential

on:
  push:
    paths:
      - '.github/workflows/add-itpro-cert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add credential
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('experience.html')
          text = path.read_text()
          if 'Apple Certified IT Professional' not in text:
              target = '            <div class="credential-item">\n              <strong>CompTIA A+</strong>\n              <span>CompTIA</span>\n            </div>\n'
              insert = '            <div class="credential-item">\n              <strong>Apple Certified IT Professional</strong>\n              <span>Apple Inc. · Issued Aug 2026 · Expires Aug 2028</span>\n              <p>Recognizes knowledge needed to deploy, manage, and secure Apple devices at scale in large organizations.</p>\n            </div>\n\n'
              if target not in text:
                  raise SystemExit('Technical + Apple credential target not found')
              text = text.replace(target, insert + target, 1)
              path.write_text(text)
          else:
              print('Apple Certified IT Professional already present')
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/add-itpro-cert.yml
      - name: Commit credential update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Apple IT Professional credential"
          git push
