name: Simplify homepage nav two
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'      <div class="nav-links">\n(?:        <a [^\n]+</a>\n)+      </div>', '''      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#where-i-create-value">How I Help</a>
        <a href="#project-management">Work</a>
        <a href="#more-experience">Proof</a>
        <a href="#contact">Contact</a>
      </div>''', s, count=1)
          p.write_text(s)
          for f in ['.github/workflows/simplify-homepage-nav.yml', '.github/workflows/simplify-homepage-nav-2.yml', '.github/workflows/trigger-simplify-homepage-nav.txt']:
              q = Path(f)
              if q.exists():
                  q.unlink()
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/simplify-homepage-nav.yml .github/workflows/simplify-homepage-nav-2.yml .github/workflows/trigger-simplify-homepage-nav.txt
          git commit -m "Simplify homepage navigation" || exit 0
          git push
