name: Add Learning Credentials Nav

on:
  push:
    paths:
      - '.github/workflows/add-learning-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Learning nav link across site
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          homepage_nav = '''      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#where-i-create-value">How I Help</a>
        <a href="#work">Work</a>
        <a href="#proof">Evidence</a>
        <a href="learning.html">Learning</a>
        <a href="values.html">How I Work</a>
        <a href="#contact">Contact</a>
      </div>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text()
              original = text

              if path.name == 'index.html':
                  text = re.sub(
                      r'      <div class="nav-links">\n(?:        <a href="[^"]+">[^<]+</a>\n)+      </div>',
                      homepage_nav,
                      text,
                      count=1,
                  )
              elif path.name != 'learning.html' and 'learning.html' not in text:
                  text = text.replace(
                      '        <a href="values.html">How I Work</a>',
                      '        <a href="learning.html">Learning</a>\n        <a href="values.html">How I Work</a>',
                      1,
                  )

              if text != original:
                  path.write_text(text)
                  print(f'patched {path.name}')
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/add-learning-nav.yml
      - name: Commit nav update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add learning credentials page to navigation"
          git push
