name: Retarget portfolio for SDS roles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  retarget:
    if: contains(github.event.head_commit.message, 'Run SDS portfolio retarget')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update portfolio story and work samples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo_root = Path('.')
          index_path = repo_root / 'index.html'
          samples_path = repo_root / 'samples.html'
          workflow_path = repo_root / '.github/workflows/retarget-sds-portfolio.yml'

          # --- index.html: SDS proof-layer retarget ---
          text = index_path.read_text(encoding='utf-8')

          text = text.replace('<a href="#about">About</a>\n  <a href="values.html">Values</a>', '<a href="#about">About</a>\n  <a href="#where-i-create-value">Value</a>\n  <a href="values.html">How I Work</a>')
          text = text.replace('>PM Work</a>', '>Project + Process</a>')
          text = text.replace('>ID Work</a>', '>Learning + Enablement</a>')

          text = re.sub(
              r'(<p class="lead">\s*)I bring structure to messy, cross-functional work by aligning people,\s*timelines, risks, communication, and process\. My instructional design\s*background helps me make the work clear, usable, and ready to launch\.\s*(</p>)',
              r'''\1I help teams bring structure, clarity, and follow-through to complex work across operations, learning, process, tools, and risk-adjacent environments. My instructional design background helps me make the work clear, usable, and ready to launch.\2''',
              text,
              flags=re.S,
          )

          text = text.replace('<strong>PM</strong>\n          <span>Planning + Delivery</span>', '<strong>PM</strong>\n          <span>Program Execution</span>')
          text = text.replace('<strong>ID</strong>\n          <span>Learning + Adoption</span>', '<strong>Enable</strong>\n          <span>Learning + Adoption</span>')
          text = text.replace('<strong>AI</strong>\n          <span>Workflow Support</span>', '<strong>Ops</strong>\n          <span>Visibility + Signals</span>')

          value_section = '''  <section id="where-i-create-value">
    <div class="section-kicker">Where I Create Value</div>
    <h2>Structure for complex, cross-functional work.</h2>

    <p class="section-intro">
      I help teams bring clarity and follow-through to work that sits between people, process,
      tools, learning, analytics, risk, and business outcomes. My strength is turning ambiguity
      into a usable operating rhythm: what matters, what is changing, who owns it, and what needs to happen next.
    </p>

    <div class="grid-4">
      <div class="card pm-card">
        <h3>Project + Program Support</h3>
        <p>
          I bring structure to ambiguous work through clear plans, ownership, timelines, risks,
          dependencies, decision points, and status rhythms.
        </p>
      </div>

      <div class="card id-card">
        <h3>Readiness + Adoption</h3>
        <p>
          I help teams understand what is changing, why it matters, what they need to do next,
          and where to go for support.
        </p>
      </div>

      <div class="card tech-card">
        <h3>Operational Visibility</h3>
        <p>
          I use data, trends, reporting, dashboards, audits, and operational signals to clarify
          what is happening and support better decisions.
        </p>
      </div>

      <div class="card neutral-card">
        <h3>Learning + Team Enablement</h3>
        <p>
          I create documentation, workshops, communication, and support systems that help teams
          build capability without creating more noise.
        </p>
      </div>
    </div>
  </section>'''

          if 'id="where-i-create-value"' not in text:
              anchor = '  <section id="featured-project">'
              if anchor not in text:
                  anchor = '  <section id="project-management">'
              text = text.replace(anchor, value_section + '\n\n' + anchor)

          text = text.replace('<div class="section-kicker">PM Portfolio</div>\n  <h2>Project management case studies</h2>', '<div class="section-kicker">Project + Process Work</div>\n  <h2>Project and process case studies</h2>')
          text = text.replace('<div class="section-kicker">ID Portfolio</div>\n  <h2>Instructional design case studies</h2>', '<div class="section-kicker">Learning + Enablement Work</div>\n  <h2>Learning and enablement case studies</h2>')

          text = re.sub(
              r'<strong>Result:</strong> Supported a pilot that improved key service and\s*experience paths while creating clearer structure for future learning work\.',
              '<strong>Result:</strong> Supported pilot tracks with measurable improvements in key service paths,\n        including Case AHT reductions of 1+ minute to nearly 1.5 minutes, alongside improved CSAT and Issue Resolution.',
              text,
          )

          text = text.replace(
              'Created clearer status tracking, stronger follow-up,\n        and better support for decision-making.',
              'Used reporting and operational signals to make patterns, risks, and follow-up needs easier to see,\n        giving leaders and managers stronger support for decision-making.'
          )

          team_enablement_card = '''    <div class="card id-card">
      <h3>Team Enablement + Facilitation</h3>

      <p>
        <strong>Challenge:</strong> Teams needed practical ways to create shared understanding,
        reduce friction, and keep work moving across different priorities and working styles.
      </p>

      <p>
        <strong>Action:</strong> Supported workshops, documentation, leadership communication,
        shared operating rhythms, and team-facing resources that helped people align around the work.
      </p>

      <p>
        <strong>Result:</strong> Helped groups build clearer expectations, stronger participation,
        and more consistent follow-through.
      </p>

      <div class="tag-list">
        <span class="tag">Facilitation</span>
        <span class="tag">Team Enablement</span>
        <span class="tag">Operating Rhythm</span>
        <span class="tag">Leadership Communication</span>
      </div>
    </div>
'''

          if 'Team Enablement + Facilitation' not in text:
              text = text.replace('    <div class="card id-card">\n      <h3>Performance-Focused Learning</h3>', team_enablement_card + '\n    <div class="card id-card">\n      <h3>Performance-Focused Learning</h3>')

          text = text.replace('Training, experience, and selected work samples', 'Proof, samples, and deeper experience')
          text = text.replace('Explore additional RSS Senior Specialist work, continued learning,\n    training projects, extended credentials, and selected writing, evaluation, and learning design samples.', 'Explore additional RSS Senior Specialist work, continued learning,\n    training projects, extended credentials, selected samples, and the deeper proof behind my project, process, and enablement work.')

          index_path.write_text(text, encoding='utf-8')

          # --- samples.html: minimize older writing samples and emphasize proof layer ---
          samples = samples_path.read_text(encoding='utf-8')

          samples = samples.replace('<title>Amber Largent | Selected Work Samples</title>', '<title>Amber Largent | Proof + Work Samples</title>')
          samples = samples.replace('<span>Selected Work Samples</span>', '<span>Proof + Work Samples</span>')
          samples = samples.replace('<a href="values.html">Values</a>', '<a href="values.html">How I Work</a>')
          samples = samples.replace('<div class="eyebrow">Writing • Evaluation • Learning Design</div>', '<div class="eyebrow">Proof • Launch Work • Supporting Samples</div>')
          samples = samples.replace('<h1>Selected work samples.</h1>', '<h1>Proof and selected work samples.</h1>')
          samples = samples.replace('A curated set of writing, learning design, evaluation, and communication samples.\n        Each sample includes a short portfolio framing note and a full PDF.', 'A sharper proof layer for project, process, learning, adoption, and communication work.\n        The strongest examples appear first; older writing samples stay available as supporting evidence.')

          if '.supporting-samples' not in samples:
              extra_css = '''

    .supporting-samples {
      margin-top: 34px;
      padding-top: 28px;
      border-top: 2px solid rgba(3, 3, 3, 0.12);
    }

    .supporting-samples h3 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .supporting-intro {
      max-width: 760px;
      margin: 0 0 22px;
      font-size: 17px;
      color: #202020;
    }

    .compact-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .compact-sample {
      gap: 12px;
      padding: 22px;
      border-top-color: var(--blush);
    }

    .compact-sample h3 {
      font-size: 23px;
    }

    .compact-sample .approach {
      display: none;
    }
'''
              samples = samples.replace('    .note-card {', extra_css + '\n    .note-card {')

          new_samples_section = '''  <section id="samples">
    <div class="section-kicker">Selected Proof</div>
    <h2>Launch work, enablement, and supporting samples</h2>

    <p class="section-intro">
      These examples support the SDS story: complex work made clearer through project structure,
      useful systems, operational visibility, learning, adoption, and communication that helps people act.
    </p>

    <div class="samples-grid">
      <article class="sample-card learning-card">
        <div class="category">Featured Launch Project</div>

        <h3>Tri-Parish Website Redesign</h3>

        <p>
          A full-cycle project example taken from concept to launched product: audience needs,
          site structure, content strategy, build support, domain coordination, and launch readiness.
        </p>

        <h4>Skills demonstrated</h4>

        <p>
          Project execution, stakeholder support, content strategy, user pathways, technical launch support,
          plain-language writing, and maintainable site structure.
        </p>

        <div class="tag-list">
          <span class="tag">Project Management</span>
          <span class="tag">Launch Readiness</span>
          <span class="tag">Content Strategy</span>
          <span class="tag">GitHub Pages</span>
        </div>

        <div class="approach">
          <p>
            <strong>Challenge:</strong> A multi-parish community needed a clearer digital front door for visitors,
            parishioners, families, events, giving, bulletins, and essential parish information.
          </p>

          <p>
            <strong>Action:</strong> Organized the work, clarified visitor pathways, wrote site copy,
            supported the build, checked links and page flow, and helped move the site to public launch.
          </p>

          <p>
            <strong>Value:</strong> Shows full-cycle ownership across project planning, communication,
            technical coordination, and launch follow-through.
          </p>
        </div>

        <div class="sample-actions">
          <a class="button" href="triparish.html">View Case Study</a>
          <a class="button" href="https://triparishok.org/" target="_blank" rel="noopener noreferrer" aria-label="View the live Tri-Parish website">
            View Live Site
          </a>
        </div>
      </article>

      <article class="sample-card learning-card">
        <div class="category">Community Learning Design</div>

        <h3>Living Our Faith At Work</h3>

        <p>
          A 42-day community learning experience designed for private reflection,
          asynchronous discussion, and live global conversation.
        </p>

        <h4>Skills demonstrated</h4>

        <p>
          Program design, reflection-question writing, community learning, discussion planning,
          facilitation structure, and multi-format engagement.
        </p>

        <div class="tag-list">
          <span class="tag">Program Design</span>
          <span class="tag">Facilitation Structure</span>
          <span class="tag">Community Learning</span>
          <span class="tag">Global Sessions</span>
        </div>

        <div class="approach">
          <p>
            <strong>Challenge:</strong> A global audience needed a meaningful way to connect,
            reflect, and participate without requiring one single format or time zone.
          </p>

          <p>
            <strong>Action:</strong> Designed a structured experience that supported self-paced
            reflection, asynchronous discussion, and live conversation.
          </p>

          <p>
            <strong>Value:</strong> Created a flexible learning experience that supported connection,
            reflection, and practical workplace application.
          </p>
        </div>

        <div class="sample-actions">
          <a class="button" href="Living%20Our%20Faith%20At%20Work.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open full PDF for Living Our Faith At Work">
            Open Full PDF
          </a>
        </div>
      </article>

      <article class="sample-card technology-card">
        <div class="category">Responsible Technology + AI Thinking</div>

        <h3>Philosophy of Technology for Education</h3>

        <p>
          A professional philosophy statement on technology, accessibility, AI, ethics,
          instructional design, and human-centered learning.
        </p>

        <h4>Skills demonstrated</h4>

        <p>
          AI literacy, accessibility thinking, technology analysis, ethical judgment,
          and practical learning-design decision-making.
        </p>

        <div class="tag-list">
          <span class="tag">AI Literacy</span>
          <span class="tag">Accessibility</span>
          <span class="tag">Technology Strategy</span>
          <span class="tag">Human-Centered Design</span>
        </div>

        <div class="approach">
          <p>
            <strong>Challenge:</strong> Technology and AI are often treated as either a threat
            or a cure-all, instead of tools that require purpose, limits, and human judgment.
          </p>

          <p>
            <strong>Action:</strong> Built and updated a human-centered philosophy for using
            technology in education, focused on access, information, connection, and facilitator support.
          </p>

          <p>
            <strong>Value:</strong> Supports responsible learning design, practical AI use,
            accessibility, and learner-centered decision-making.
          </p>
        </div>

        <div class="sample-actions">
          <a class="button" href="philosophy-of-technology-for-education-clean.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open full PDF for Philosophy of Technology for Education">
            Open Full PDF
          </a>
        </div>
      </article>
    </div>

    <div class="supporting-samples">
      <h3>Supporting writing samples</h3>
      <p class="supporting-intro">
        These pieces stay available as additional evidence of writing, communication, and evaluation judgment,
        but they are intentionally minimized so the page leads with stronger role-relevant proof.
      </p>

      <div class="samples-grid compact-grid">
        <article class="sample-card compact-sample communication-card">
          <div class="category">Supporting Writing Sample</div>
          <h3>Making Global Work...Work</h3>
          <p>
            A practical communication sample about clearer collaboration across time zones,
            locations, cultures, and working styles.
          </p>
          <div class="tag-list">
            <span class="tag">Global Teaming</span>
            <span class="tag">Plain Language</span>
            <span class="tag">Team Enablement</span>
          </div>
          <div class="sample-actions">
            <a class="button" href="making-global-work-work-clean.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open full PDF for Making Global Work...Work">
              Open PDF
            </a>
          </div>
        </article>

        <article class="sample-card compact-sample evaluation-card">
          <div class="category">Supporting Evaluation Sample</div>
          <h3>The Power of Storytelling in Training Evaluation</h3>
          <p>
            A long-form evaluation sample about connecting training outcomes, performance signals,
            stakeholder reporting, and human impact.
          </p>
          <div class="tag-list">
            <span class="tag">Evaluation Strategy</span>
            <span class="tag">Learning Analytics</span>
            <span class="tag">Stakeholder Reporting</span>
          </div>
          <div class="sample-actions">
            <a class="button" href="training-evaluation-storytelling-clean.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open full PDF for The Power of Storytelling in Training Evaluation">
              Open PDF
            </a>
          </div>
        </article>
      </div>
    </div>
  </section>'''

          samples = re.sub(
              r'  <section id="samples">.*?\n  </section>\n\n  <section id="next">',
              new_samples_section + '\n\n  <section id="next">',
              samples,
              flags=re.S,
          )

          samples = samples.replace('<div class="section-kicker">Connected Portfolio</div>\n    <h2>How these samples connect to the work.</h2>', '<div class="section-kicker">Connected Proof</div>\n    <h2>How these samples support the SDS story.</h2>')
          samples = samples.replace('These samples show how I use communication, evaluation, instructional design, and technology\n      strategy to make complex work clearer, more accessible, and easier to apply.', 'These samples show how I use communication, project structure, learning design, operational thinking, and technology\n      judgment to make complex work clearer, more usable, and easier to act on.')
          samples = samples.replace('The throughline: make the work clear, support different ways people participate,\n      and create resources people can actually use.', 'The throughline: make the work clear, build useful systems, support adoption, and help people move toward measurable outcomes.')
          samples = samples.replace('© 2026 Amber Largent · Selected Work Samples', '© 2026 Amber Largent · Proof + Work Samples')

          samples_path.write_text(samples, encoding='utf-8')

          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit SDS retarget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html samples.html .github/workflows/retarget-sds-portfolio.yml
            git commit -m "Retarget portfolio proof layer for SDS roles"
            git push
          fi
