name: Run case study and quote update

on:
  push:
    paths:
      - 'scripts/fix_case_study_and_quotes.py'
      - '.github/workflows/run-case-study-and-quotes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run case study and quote update
        run: python scripts/fix_case_study_and_quotes.py

      - name: Remove temporary files
        run: |
          rm scripts/fix_case_study_and_quotes.py
          rm .github/workflows/run-case-study-and-quotes.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add capacity planning case study and feedback quotes" || echo "No changes to commit"
          git push
