name: Run tighten positioning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run positioning script
        run: python3 scripts/tighten_positioning.py

      - name: Remove temporary files
        run: |
          rm scripts/tighten_positioning.py
          rm .github/workflows/run-tighten-positioning.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html experience.html learning.html scripts/tighten_positioning.py .github/workflows/run-tighten-positioning.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Tighten portfolio positioning and proof"
            git push
          fi
