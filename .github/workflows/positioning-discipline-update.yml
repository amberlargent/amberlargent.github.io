          for filename, reps in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in reps:
                  if old not in text:
                      print(f"MISSING in {filename}: {old[:80]!r}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  print(f"updated {filename}")
              else:
                  print(f"no change {filename}")
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/positioning-discipline-update.yml
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html experience.html learning.html .github/workflows/positioning-discipline-update.yml
          git commit -m "Tighten portfolio positioning and proof" || echo "No changes to commit"
          git push
