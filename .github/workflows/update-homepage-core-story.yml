name: Update homepage core story

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-homepage:
    if: contains(github.event.head_commit.message, 'Run homepage core story update')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_lead = '''        <p class="lead">
          I help teams bring structure, clarity, and follow-through to complex work across operations,
          learning, process, tools, and risk-adjacent environments. My instructional design background
          helps me make the work clear, usable, and ready to launch.
        </p>'''

          new_lead = '''        <p class="lead">
          First, I listen and learn the systems. Then I help teams create structure that makes work
          clearer, not heavier.
        </p>

        <p class="lead">
          I bring equal strength in learning and facilitation, project and process leadership,
          AI enablement, Chorus knowledge systems, and operational visibility to help teams learn,
          align, and move complex work forward.
        </p>'''
          text = text.replace(old_lead, new_lead)

          old_stats = '''        <div class="stats">
          <div class="stat">
            <strong>14+</strong>
            <span>Years at Apple</span>
          </div>

          <div class="stat">
            <strong>PM</strong>
            <span>Program Execution</span>
          </div>

          <div class="stat">
            <strong>Enable</strong>
            <span>Learning + Adoption</span>
          </div>

          <div class="stat">
            <strong>Ops</strong>
            <span>Visibility + Signals</span>
          </div>
        </div>'''

          new_stats = '''        <div class="stats">
          <div class="stat">
            <strong>L&D</strong>
            <span>Learning + Facilitation</span>
          </div>

          <div class="stat">
            <strong>PM</strong>
            <span>Project + Process</span>
          </div>

          <div class="stat">
            <strong>AI</strong>
            <span>Enablement + Practice</span>
          </div>

          <div class="stat">
            <strong>Chorus</strong>
            <span>Knowledge Systems</span>
          </div>
        </div>'''
          text = text.replace(old_stats, new_stats)

          about_pattern = r'''    <section id="about">.*?    </section>\n\n    <section id="where-i-create-value">'''
          new_about_plus_open = '''    <section id="about">
      <div class="section-kicker">About</div>
      <h2>Listen first. Structure second. Move forward together.</h2>

      <p class="section-intro">
        I believe good structure should make work clearer, not heavier.
      </p>

      <div class="card neutral-card">
        <p>
          First, I listen and learn the systems. I ask better questions, look for patterns,
          and work to understand the people doing the work. Then I help teams create the
          right amount of structure so priorities, processes, tools, and people can work better together.
        </p>

        <p>
          My goal is simple: make the work easier to understand, easier to sustain,
          and more efficient for the people doing it.
        </p>

        <p>
          I bring this approach to learning design, facilitation, project and process leadership,
          AI enablement, Chorus knowledge systems, and operational visibility.
        </p>
      </div>
    </section>

    <section id="where-i-create-value">'''
          text = re.sub(about_pattern, new_about_plus_open, text, flags=re.S)

          value_pattern = r'''    <section id="where-i-create-value">.*?    </section>\n\n    <section id="featured-project">'''
          new_value_plus_next = '''    <section id="where-i-create-value">
      <div class="section-kicker">How I Create Clarity</div>
      <h2>Equal strength across learning, process, AI, knowledge, and operations.</h2>

      <p class="section-intro">
        My work sits where people, learning, process, tools, AI, knowledge, and execution meet.
        I start by listening, learning the system, and understanding what people are carrying.
        Then I help create the right amount of structure so work becomes clearer, lighter,
        and easier to move forward.
      </p>

      <div class="grid-3">
        <div class="card id-card">
          <h3>Learning + Facilitation</h3>
          <p>
            I design and facilitate learning experiences that help people understand what is changing,
            build confidence, and apply new skills in real work.
          </p>
        </div>

        <div class="card pm-card">
          <h3>Project + Process Leadership</h3>
          <p>
            I bring structure to ambiguous work through clear ownership, timelines, dependencies,
            risks, decisions, and follow-through.
          </p>
        </div>

        <div class="card tech-card">
          <h3>AI Enablement</h3>
          <p>
            I help teams explore AI responsibly and practically by sharing examples, prompt practices,
            resources, and workflows people can actually use.
          </p>
        </div>

        <div class="card neutral-card">
          <h3>Chorus + Knowledge Systems</h3>
          <p>
            I design, audit, maintain, and improve knowledge spaces so information is easier to find,
            trust, share, and sustain.
          </p>
        </div>

        <div class="card tech-card">
          <h3>Operational Visibility</h3>
          <p>
            I use metrics, trends, dashboards, audits, and operational signals to clarify what is happening
            and support better decisions.
          </p>
        </div>

        <div class="card id-card">
          <h3>Team Effectiveness + Change</h3>
          <p>
            I help teams build shared language, working rhythms, trust, role clarity, and practical next steps
            during change.
          </p>
        </div>
      </div>
    </section>

    <section id="featured-project">'''
          text = re.sub(value_pattern, new_value_plus_next, text, flags=re.S)

          text = text.replace('<a href="#where-i-create-value">Value</a>', '<a href="#where-i-create-value">Clarity</a>')
          text = text.replace('<span>Project + Process Leader</span>', '<span>Learning • Process • AI • Knowledge Systems</span>')

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/update-homepage-core-story.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html .github/workflows/update-homepage-core-story.yml
            git commit -m "Update homepage core story"
            git push
          fi
